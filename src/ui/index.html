<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#07080d" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f5f6fa" media="(prefers-color-scheme: light)" />
    <meta name="description" content="Vexo Field Assistant — review, approve and deliver visit notes." />
    <title>Vexo Field Assistant</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
    />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%238d7dff'/%3E%3Cstop offset='1' stop-color='%232fc6e8'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect x='1' y='1' width='30' height='30' rx='9' fill='url(%23g)'/%3E%3Cpath d='M9 10.5 L16 22 L23 10.5' fill='none' stroke='white' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E"
    />
    <style>
      html { background: #07080d; }
      @media (prefers-color-scheme: light) { html { background: #f5f6fa; } }
      .boot { min-height: 100vh; display: grid; place-items: center; font: 15px/1.5 system-ui, -apple-system, sans-serif; color: #a0a6b4; text-align: center; padding: 24px; }
      .boot button { margin-top: 12px; font: inherit; padding: 8px 16px; border-radius: 8px; border: 1px solid #8d7dff; background: #5a48ee; color: #fff; cursor: pointer; }
    </style>
  </head>
  <body>
    <!-- Placeholder until React mounts (it replaces #root's children). If the app bundle
         never runs (network error, blocked script), the boot check below offers a reload
         instead of leaving a blank page. -->
    <div id="root"><div class="boot" id="boot">Loading Vexo Field Assistant…</div></div>
    <noscript>Vexo Field Assistant requires JavaScript.</noscript>
    <script>
      setTimeout(function () {
        var b = document.getElementById("boot");
        if (!b) return;
        b.innerHTML = "<div>The app didn't load. Check your connection, then reload.<br /><button type=\"button\" onclick=\"location.reload()\">Reload</button></div>";
      }, 12000);
    </script>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
